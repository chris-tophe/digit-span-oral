<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Span Oral - Exercice de Mémoire</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-brain"></i>
            </div>
            <h1>Digit Span Oral</h1>
            <p class="subtitle">Exercice de mémorisation auditive</p>
        </header>

        <main>
            <div class="settings">
                <div class="setting-group">
                    <label for="spanLength">Longueur de la série:</label>
                    <input type="number" id="spanLength" min="3" max="12" value="5">
                </div>
                <div class="setting-group">
                    <label for="allowDuplicates">Autoriser les doublons:</label>
                    <input type="checkbox" id="allowDuplicates" checked>
                </div>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn primary">
                    <i class="fas fa-microphone"></i> Commencer l'exercice
                </button>
                <button id="stopBtn" class="btn secondary" disabled>
                    <i class="fas fa-stop"></i> Arrêter
                </button>
            </div>

            <div class="display">
                <div id="numberDisplay" class="numbers hidden">
                    <span id="currentNumber"></span>
                </div>
                <div id="status" class="status">
                    <i class="fas fa-volume-up"></i> Prêt à commencer
                </div>
            </div>

            <div class="response-section">
                <h3>Votre réponse:</h3>
                <div class="response-inputs">
                    <div class="mode-selector">
                        <label>
                            <input type="radio" name="mode" value="forward" checked>
                            <span><i class="fas fa-arrow-right"></i> Ordre normal</span>
                        </label>
                        <label>
                            <input type="radio" name="mode" value="reverse">
                            <span><i class="fas fa-arrow-left"></i> Ordre inverse</span>
                        </label>
                        <label>
                            <input type="radio" name="mode" value="ascending">
                            <span><i class="fas fa-sort-numeric-up"></i> Ordre croissant</span>
                        </label>
                    </div>
                    <div id="inputContainer" class="input-container">
                        <!-- Les inputs seront générés dynamiquement -->
                    </div>
                </div>
                <button id="submitBtn" class="btn success" disabled>
                    <i class="fas fa-check"></i> Valider
                </button>
            </div>

            <div class="results">
                <h3>Résultats:</h3>
                <div id="resultsList"></div>
                <div class="stats">
                    <span><i class="fas fa-check-circle"></i> Bonnes réponses: <span id="correctCount">0</span></span>
                    <span>|</span>
                    <span><i class="fas fa-chart-line"></i> Taux de réussite: <span id="successRate">0%</span></span>
                </div>
            </div>
        </main>

        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-icon">
                    <i class="fas fa-lightbulb"></i>
                </div>
                <h2 id="modalTitle">Écoutez attentivement...</h2>
                <p id="modalMessage"></p>
                <button id="modalClose" class="btn primary">
                    <i class="fas fa-times"></i> OK
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

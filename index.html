<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Digit Span - Apple Style</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5f5f7">
    <meta name="apple-mobile-web-app-title" content="Digit Span">
    <meta name="description" content="Exercice de mémorisation de chiffres - Style Apple">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="currentColor"/>
                    <path d="M12 6C8.69 6 6 8.69 6 12H8C8 9.76 9.76 8 12 8V6ZM12 18C9.76 18 8 16.24 8 14H6C6 17.31 8.69 20 12 20V18ZM16 12C16 14.21 14.21 16 12 16V14C13.76 14 16 12.76 16 12ZM12 10C14.21 10 16 11.79 16 14H14C14 12.76 13.76 12 12 12V10Z" fill="currentColor"/>
                </svg>
            </div>
            <h1>Digit Span</h1>
            <p class="subtitle">Exercice de mémoire auditive</p>
        </header>

        <main>
            <div class="settings">
                <div class="setting-group">
                    <label for="spanLength">Longueur:</label>
                    <input type="number" id="spanLength" min="3" max="12" value="5">
                </div>
                <div class="setting-group">
                    <label for="allowDuplicates">Doublons:</label>
                    <input type="checkbox" id="allowDuplicates" checked>
                </div>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14C13.1 14 14 13.1 14 12V8C14 6.9 13.1 6 12 6C10.9 6 10 6.9 10 8V12C10 13.1 10.9 14 12 14ZM16 8C16 6.9 15.1 6 14 6H10C8.9 6 8 6.9 8 8V18C8 19.1 8.9 20 10 20H14C15.1 20 16 19.1 16 18V8ZM20 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4Z"/>
                    </svg>
                    Commencer
                </button>
                <button id="stopBtn" class="btn secondary" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12" rx="2"/>
                    </svg>
                    Arrêter
                </button>
            </div>

            <div class="display">
                <div id="numberDisplay" class="numbers hidden">
                    <span id="currentNumber"></span>
                </div>
                <div id="status" class="status">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9V15C3 16.1 3.9 17 5 17H7C7.55 17 8 17.45 8 18V20C8 20.55 8.45 21 9 21H15C15.55 21 16 20.55 16 20V18C16 17.45 16.45 17 17 17H19C20.1 17 21 16.1 21 15V9C21 7.9 20.1 7 19 7H5C3.9 7 3 7.9 3 9ZM9 9V15C9 15.55 9.45 16 10 16H14C14.55 16 15 15.55 15 15V9C15 8.45 14.55 8 14 8H10C9.45 8 9 8.45 9 9Z"/>
                    </svg>
                    Prêt à commencer
                </div>
            </div>

            <div class="response-section">
                <h3>Votre réponse:</h3>
                <div class="response-inputs">
                    <div class="mode-selector">
                        <label>
                            <input type="radio" name="mode" value="forward" checked>
                            <span>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M13 19L19 13L13 7"/>
                                    <path d="M19 13H5"/>
                                </svg>
                                Normal
                            </span>
                        </label>
                        <label>
                            <input type="radio" name="mode" value="reverse">
                            <span>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M11 19L5 13L11 7"/>
                                    <path d="M5 13H21"/>
                                </svg>
                                Inverse
                            </span>
                        </label>
                        <label>
                            <input type="radio" name="mode" value="ascending">
                            <span>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M18 21V19H6V5H8V3C8 2.45 8.45 2 9 2H15C15.55 2 16 2.45 16 3V5H18C18.55 5 19 5.45 19 6V21C19 21.55 18.55 22 18 22ZM14 21V3H10V21Z"/>
                                </svg>
                                Croissant
                            </span>
                        </label>
                    </div>
                    <div id="inputContainer" class="input-container">
                        <!-- Inputs générés dynamiquement -->
                    </div>
                </div>
                <button id="submitBtn" class="btn success" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 12L11 14L15 10"/>
                    </svg>
                    Valider
                </button>
            </div>

            <div class="results">
                <h3>Résultats:</h3>
                <div id="resultsList"></div>
                <div class="stats">
                    <span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z"/>
                        </svg>
                        Bonnes: <span id="correctCount">0</span>
                    </span>
                    <span>|</span>
                    <span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V8H19V19ZM7 10H9V12H7V10ZM11 10H13V12H11V10ZM15 10H17V12H15V10Z"/>
                        </svg>
                        Réussite: <span id="successRate">0%</span>
                    </span>
                </div>
            </div>
        </main>

        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 18C9.24 18 7 15.76 7 13C7 10.24 9.24 8 12 8C14.76 8 17 10.24 17 13C17 15.76 14.76 18 12 18Z"/>
                    </svg>
                </div>
                <h2 id="modalTitle">Écoutez...</h2>
                <p id="modalMessage"></p>
                <button id="modalClose" class="btn primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"/>
                    </svg>
                    OK
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

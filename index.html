<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Digit Span - Modern Design</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f23">
    <meta name="apple-mobile-web-app-title" content="Digit Span">
    <meta name="description" content="Exercice de mémorisation de chiffres - Design Moderne">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M8 10L12 12L8 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 10L12 12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1>Digit Span</h1>
            <p class="subtitle">Exercice de mémoire auditive</p>
        </header>

        <main>
            <div class="settings card">
                <div class="setting-group">
                    <label for="spanLength">Longueur:</label>
                    <input type="number" id="spanLength" min="3" max="12" value="5">
                </div>
                <div class="setting-group">
                    <label for="allowDuplicates">Doublons:</label>
                    <input type="checkbox" id="allowDuplicates" checked>
                </div>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1V23"/>
                        <path d="M8 5H16"/>
                        <path d="M8 12H16"/>
                        <path d="M8 19H16"/>
                        <path d="M4 9H8"/>
                        <path d="M16 9H20"/>
                    </svg>
                    Commencer
                </button>
                <button id="stopBtn" class="btn secondary" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="4" y="4" width="16" height="16" rx="2"/>
                    </svg>
                    Arrêter
                </button>
            </div>

            <div class="display card">
                <div id="numberDisplay" class="numbers hidden">
                    <span id="currentNumber"></span>
                </div>
                <div id="status" class="status">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11,5 11,19 17,12"/>
                        <polyline points="9,12 15,12"/>
                    </svg>
                    Prêt à commencer
                </div>
            </div>

            <div class="response-section card">
                <h3>Votre réponse:</h3>
                <div class="response-inputs">
                    <div class="mode-selector">
                        <label>
                            <input type="radio" name="mode" value="forward" checked>
                            <span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="5" y1="12" x2="19" y2="12"/>
                                    <polyline points="12,5 19,12 12,19"/>
                                </svg>
                                Normal
                            </span>
                        </label>
                        <label>
                            <input type="radio" name="mode" value="reverse">
                            <span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="19" y1="12" x2="5" y2="12"/>
                                    <polyline points="12,19 5,12 12,5"/>
                                </svg>
                                Inverse
                            </span>
                        </label>
                        <label>
                            <input type="radio" name="mode" value="ascending">
                            <span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="18,15 12,21 6,15"/>
                                    <polyline points="6,9 12,3 18,9"/>
                                </svg>
                                Croissant
                            </span>
                        </label>
                    </div>
                    <div id="inputContainer" class="input-container">
                        <!-- Inputs générés dynamiquement -->
                    </div>
                </div>
                <button id="submitBtn" class="btn success" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <polyline points="20,6 9,17 4,12"/>
                    </svg>
                    Valider
                </button>
            </div>

            <div class="results card">
                <h3>Résultats:</h3>
                <div id="resultsList"></div>
                <div class="stats">
                    <span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22,4 12,14.01 9,11.01"/>
                        </svg>
                        Bonnes: <span id="correctCount">0</span>
                    </span>
                    <span>|</span>
                    <span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 20V10"/>
                            <path d="M12 20V4"/>
                            <path d="M6 20v-6"/>
                        </svg>
                        Réussite: <span id="successRate">0%</span>
                    </span>
                </div>
            </div>
        </main>

        <div id="modal" class="modal hidden">
            <div class="modal-content card">
                <div class="modal-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                </div>
                <h2 id="modalTitle">Écoutez...</h2>
                <p id="modalMessage"></p>
                <button id="modalClose" class="btn primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    OK
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
